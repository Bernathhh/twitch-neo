<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9146FF"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="neoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Black TV Background -->
  <rect width="512" height="512" rx="100" fill="#08080a"/>
  <!-- Subtle Neo Border -->
  <rect x="3" y="3" width="506" height="506" rx="97" fill="none" stroke="url(#neoGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Twitch Glitch Neo Logo -->
  <g transform="translate(100, 74) scale(13)" filter="url(#neoGlow)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.5 0L0 4.5V23.5H6.5V28L11 23.5H16.5L24 16V0H4.5ZM21.5 14.5L18 18H12.5L9.5 21V18H6.5V2.5H21.5V14.5Z" fill="url(#neoGrad)"/>
    <!-- Glowing Neo Eyes -->
    <path d="M17.5 5.5H15.5V12.5H17.5V5.5ZM12.5 5.5H10.5V12.5H12.5V5.5Z" fill="url(#eyeGrad)"/>
  </g>
</svg>