<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130">
  <defs>
    <linearGradient id="glitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B055FF"/>
      <stop offset="50%" stop-color="#9146FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9146FF"/>
    </linearGradient>
    <filter id="aura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Black Squircle with NO white corners -->
  <rect x="0" y="0" width="130" height="130" rx="28" fill="#08080a"/>

  <!-- Subtle Cyan Neon Border -->
  <rect x="1" y="1" width="128" height="128" rx="27" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Radial Glow Behind Logo -->
  <circle cx="65" cy="52" r="38" fill="#9146FF" opacity="0.35" filter="url(#aura)"/>

  <!-- Twitch Glitch Logo -->
  <g transform="translate(32, 16) scale(2.75)" filter="url(#aura)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.5 0L0 4.5V23.5H6.5V28L11 23.5H16.5L24 16V0H4.5ZM21.5 14.5L18 18H12.5L9.5 21V18H6.5V2.5H21.5V14.5Z" fill="url(#glitchGrad)"/>
    <path d="M17.5 5.5H15.5V12.5H17.5V5.5ZM12.5 5.5H10.5V12.5H12.5V5.5Z" fill="url(#eyeGrad)"/>
  </g>

  <!-- NEO Badge -->
  <g transform="translate(35, 96)">
    <rect x="0" y="0" width="60" height="22" rx="6" fill="url(#badgeGrad)"/>
    <text x="30" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="900" fill="#08080a" text-anchor="middle" letter-spacing="2">NEO</text>
  </g>
</svg>